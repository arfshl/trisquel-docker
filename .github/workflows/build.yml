name: Build

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ main ]
    paths: [ 'build.sh', 'Dockerfile', '.github/workflows/build.yml' ]
  workflow_dispatch:

jobs:

  build-amd:
    runs-on: ubuntu-latest
    outputs:
      RELEASE: ${{ steps.start_build.outputs.RELEASE }}
    strategy:
      matrix:
        arch: [x86_64]
    env:
        ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: start_build
        run: |
          bash build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: amd
          path: ./*.tar.gz

  build-arm:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        arch: [aarch64, armhf]
    env:
        ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: start_build
        run: |
          bash build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: arm
          path: ./*.tar.gz

  push:
    runs-on: ubuntu-latest
    needs: [build-amd, build-arm]
    permissions:
      contents: read
      packages: write

    steps:
      
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Name
        run: echo "REPONAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
         path: .
         merge-multiple: true

      - name: DEBUG; Check files
        run: ls -la

      - name: Push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64, linux/arm/v7, linux/i386
          tags: |
            ghcr.io/${{ env.REPONAME }}:latest
            ghcr.io/${{ env.REPONAME }}:${{ needs.build-amd64.outputs.RELEASE }}